
# HTTP - Validacao Let's Encrypt e redirecionamento
server {
    listen 80;
    server_name goali.com.br www.goali.com.br;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html/public;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://goali.com.br$request_uri;
    }
}

# HTTPS - Aplicacao Laravel
server {
    listen 443 ssl;
    server_name goali.com.br www.goali.com.br;

    root /var/www/html/public;
    index index.php index.html;

    ssl_certificate /etc/letsencrypt/live/goali.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/goali.com.br/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    large_client_header_buffers 8 32k;
    proxy_buffer_size 32k;
    proxy_buffers 16 32k;
    proxy_busy_buffers_size 64k;

    location /favicon.ico {
        alias /var/www/html/public/favicon.ico;
        access_log off;
        log_not_found off;
        expires 30d;
    }

    location /build/ {
        alias /var/www/html/public/build/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /images/ {
        alias /var/www/html/public/images/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /storage/ {
        alias /var/www/html/public/storage/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;

        fastcgi_pass php-fpm:9000;
        fastcgi_index index.php;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_HOST $host;
        fastcgi_param SERVER_NAME $host;

        # Laravel reconhece a conexao HTTPS
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_param HTTP_PROXY "";

        fastcgi_connect_timeout 300;
        fastcgi_send_timeout 300;
        fastcgi_read_timeout 600s;

        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 32k;
        fastcgi_busy_buffers_size 64k;
        fastcgi_temp_file_write_size 64k;
    }

    location ~ /\.ht {
        deny all;
    }
}
