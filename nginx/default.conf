server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;
    index index.php index.html;
    # --------------------------------------------------------------------
    # :chave_inglesa: Correções globais de buffer
    # --------------------------------------------------------------------
    large_client_header_buffers 8 32k;
    proxy_buffer_size 32k;
    proxy_buffers 16 32k;
    proxy_busy_buffers_size 64k;
    # --------------------------------------------------------------------
    # Favicon
    # --------------------------------------------------------------------
    location /favicon.ico {
        alias /var/www/html/public/favicon.ico;
        access_log off;
        log_not_found off;
        expires 30d;
    }
    # --------------------------------------------------------------------
    # Vite build assets
    # --------------------------------------------------------------------
    location /build/ {
        alias /var/www/html/public/build/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }
    # --------------------------------------------------------------------
    # Imagens e arquivos estáticos
    # --------------------------------------------------------------------
    location /images/ {
        alias /var/www/html/public/images/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }
        # --------------------------------------------------------------------
    # Libera arquivos públicos do storage (como Excel, fotos, etc)
    # --------------------------------------------------------------------
    location /storage/ {
        alias /var/www/html/public/storage/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }
    # --------------------------------------------------------------------
    # Rotas Laravel (catch-all)
    # --------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
    # --------------------------------------------------------------------
    # PHP-FPM handler
    # --------------------------------------------------------------------
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass php-fpm:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # --- :caixa_de_ferramentas: Ajustes de desempenho e estabilidade ---
        fastcgi_connect_timeout 300;
        fastcgi_send_timeout 300;
        fastcgi_read_timeout 600s;
        # --- :atadura_adesiva: Buffers (resolve 'upstream sent too big header') ---
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 32k;
        fastcgi_busy_buffers_size 64k;
        fastcgi_temp_file_write_size 64k;
        # --- :cadeado: Laravel deve reconhecer HTTPS mesmo atrás do proxy ---
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        # --- :recibo: Headers adicionais úteis ---
        fastcgi_param HTTP_PROXY "";
        fastcgi_param SERVER_NAME $host;
    }
    # --------------------------------------------------------------------
    # Protege arquivos sensíveis (.htaccess, etc)
    # --------------------------------------------------------------------
    location ~ /\.ht {
        deny all;
    }
}