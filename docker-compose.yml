version: '3.9'

services:
  php-fpm:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravue-monolito-php
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html:cached
      - vendor:/var/www/html/vendor
      - node_modules:/var/www/html/node_modules
      - public_build:/var/www/html/public/build
    env_file:
      - .env.docker
    networks:
      - laravel-net
    depends_on:
      - mysql
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: laravue-monolito-nginx
    depends_on:
      - php-fpm
    ports:
      - "127.0.0.1:8001:80"
    volumes:
      - .:/var/www/html:ro
      - public_build:/var/www/html/public/build:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - laravel-net
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: laravue-monolito-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: laravel
      MYSQL_USER: app
      MYSQL_PASSWORD: secret
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - laravel-net
    restart: unless-stopped

volumes:
  vendor:
  node_modules:
  public_build:
  mysql_data:

networks:
  laravel-net:
    driver: bridge
